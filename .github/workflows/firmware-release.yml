name: Firmware release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Resolve and validate version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/check-firmware-version.mjs "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Compile release firmware
        run: |
          # Arduino CLI requires the folder name to match display-device.ino.
          # GitHub Actions checks out into a folder named after the repository.
          sketch_dir="${RUNNER_TEMP}/display-device"
          mkdir -p "$sketch_dir" dist
          rsync -a --exclude '.git' --exclude dist ./ "$sketch_dir/"
          arduino-cli compile \
            --fqbn esp32:esp32:mhetesp32minikit \
            --output-dir "${GITHUB_WORKSPACE}/dist" \
            "$sketch_dir"
          mv dist/display-device.ino.bin dist/inkads-esp32.bin
          mv dist/display-device.ino.merged.bin dist/inkads-esp32-factory.bin

      - name: Generate OTA manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/generate-ota-manifest.mjs dist/inkads-esp32.bin dist/inkads-manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/inkads-esp32.bin \
            dist/inkads-esp32-factory.bin \
            dist/inkads-manifest.json \
            --verify-tag \
            --generate-notes \
            --title "InkAds firmware $RELEASE_TAG"
