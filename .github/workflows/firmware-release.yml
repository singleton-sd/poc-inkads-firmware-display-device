name: Firmware release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: v-prefixed tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Checkout the workflow revision first so catalog tests see the
      # committed 0.0.0 default, and so republish of an older tag still
      # gets inject_firmware_version.sh from this file's commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run catalog tests
        run: bash scripts/test/run.sh

      - name: Preserve release scripts from the workflow revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inkads-release-scripts"
          cp -a scripts/. "$RUNNER_TEMP/inkads-release-scripts/"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Overlay current release scripts
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/inkads-release-scripts/." scripts/

      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Inject version from tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag is not semver-like: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          bash scripts/inject_firmware_version.sh "$version"
          echo "INKADS_FIRMWARE_VERSION=$version" >>"$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >>"$GITHUB_ENV"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Validate injected version
        run: node scripts/check-firmware-version.mjs "$RELEASE_TAG"

      - name: Compile release firmware
        run: |
          set -euo pipefail
          bash scripts/compile.sh --all --version "${RELEASE_TAG#v}"

      - name: Stage release assets
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/stage-release-assets.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/publish-github-release.sh
