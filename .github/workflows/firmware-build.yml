name: Firmware build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Run catalog tests
        run: bash scripts/test/run.sh

      - name: Validate firmware version
        run: node scripts/check-firmware-version.mjs

      - name: Export target matrix
        id: matrix
        run: |
          {
            echo 'matrix<<EOF'
            bash scripts/lib/targets-catalog.sh matrix
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Compile ${{ matrix.id }}
        run: bash scripts/compile.sh --target "${{ matrix.id }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactStem }}
          path: dist/*.bin
          if-no-files-found: error
