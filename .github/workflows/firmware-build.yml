name: Firmware build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Validate firmware version
        run: node scripts/check-firmware-version.mjs

      - name: Compile firmware
        run: |
          mkdir -p dist
          arduino-cli compile \
            --fqbn esp32:esp32:mhetesp32minikit \
            --output-dir dist \
            .

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkads-firmware
          path: |
            dist/display-device.ino.bin
            dist/display-device.ino.merged.bin
            dist/display-device.ino.bootloader.bin
            dist/display-device.ino.partitions.bin
          if-no-files-found: error
