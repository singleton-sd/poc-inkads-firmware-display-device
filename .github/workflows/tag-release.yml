# Compute the next semver from Conventional Commits on main and push only a
# v* tag. GITHUB_TOKEN tag pushes do not start other workflows (GitHub
# recursion guard), so this job then calls firmware-release.yml.
name: Tag release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    # No github-actions[bot] skip: this workflow does not push commits to
    # main, so it cannot loop. Bot merges (Dependabot and similar) should
    # still be able to cut a release. Restrict to main so workflow_dispatch
    # from a feature branch cannot tag a stable release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      next_tag: ${{ steps.plan.outputs.next_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next release
        id: plan
        run: bash scripts/release_plan.sh

      - name: Stop when no release is needed
        if: steps.plan.outputs.release != 'true'
        env:
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
        run: echo "No releasable conventional commits found since ${BASE_TAG}."

      - name: Push version tag only
        if: steps.plan.outputs.release == 'true'
        env:
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag $NEXT_TAG already exists" >&2
            exit 1
          fi
          git tag -a "$NEXT_TAG" -m "InkAds firmware $NEXT_TAG"
          git push origin "refs/tags/${NEXT_TAG}"

  publish:
    needs: tag
    if: needs.tag.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/firmware-release.yml
    with:
      tag: ${{ needs.tag.outputs.next_tag }}
