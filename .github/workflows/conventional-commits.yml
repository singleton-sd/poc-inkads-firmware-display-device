name: Conventional PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp branch ticket onto the PR title when missing
        id: stamp
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const branch = pull.head.ref;
            const branchMatch = branch.match(
              /^(feature|hotfix)\/([A-Z][A-Z0-9]+-[0-9]+)(?:-.*)?$/
            );
            let title = pull.title.replace(/\r/g, "").trimEnd();

            if (branchMatch && !/\[[A-Z][A-Z0-9]+-[0-9]+\]$/.test(title)) {
              title = `${title} [${branchMatch[2]}]`;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                title
              });
              core.info(`Updated PR title to: ${title}`);
            }

            core.setOutput("title", title);

      - name: Validate squash-merge commit title
        env:
          GIT_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ steps.stamp.outputs.title }}
        run: sh scripts/check-conventional-title.sh "$PR_TITLE"
